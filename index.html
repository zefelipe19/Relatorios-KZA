<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js" defer></script>
    <script src="app.js" defer></script>
    <title>KZA - PDF</title>
  </head>
  <body>
    <header class="container">
        <h1>KZA - Gerador de relatórios</h1>
    </header>
    <main class="container" id="app">
        <div>
            <label for="pdfDocuments">Inportar todos os documentos PDF:</label>
            <input type="file" id="pdfDocuments" name="pdfDocuments" accept=".pdf" multiple>
        </div>
        
        <form id="pdfForm" class="mt-3"></form>

        <div class="container mt-3 mb-3" id="pdfReport"></div>
    </main>
    <footer class="container">
        <p>&copy; Zé Felipe. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
